[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-evidence-analyst"
version = "0.3.0"
description = "L2 v0.3 Behavioral Event Localization: value curves, predicate hypotheses, and scoring over L1 evidence"
requires-python = ">=3.12"
dependencies = ["lxml>=5,<7", "c3-experimental-sandbox>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
l2 = "l2_sandbox.cli:main"
c3-l2 = "l2_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: explicitly authorized model/API integration"]
