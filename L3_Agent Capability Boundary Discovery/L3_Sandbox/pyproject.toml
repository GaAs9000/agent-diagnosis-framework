[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l3-capability-boundary"
version = "0.1.0"
description = "Frozen conditional-performance experiments over native L1 evidence"
requires-python = ">=3.12"
dependencies = ["c3-experimental-sandbox>=0.2.0", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
l3 = "l3_sandbox.cli:main"
c3-l3 = "l3_sandbox.cli:main"

[project.entry-points."l1.benchmarks"]
l3-officeval = "l3_sandbox.conditions:ConditionOfficeVal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../L1_sandbox/C3_Experimental_Sandbox/src"]
testpaths = ["tests"]
